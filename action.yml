name: "Upload to CurseForge"
description: "Uploads files to CurseForge via CurseForge API"
author: "itsmeow"
inputs:
  token:
    description: "Token used to authenticate with CurseForge API. Use a repository secret for this."
    required: true
  project_id:
    description: "Project id (numerical) to upload file to. You can get the numerical ID from the sidebar on a project page."
    required: true
  game_endpoint:
    description: "The subdomain of curseforge.com where the upload request will be made. (minecraft, kerbal, etc.)"
    required: true
  file_path:
    description: "Exact path to the main file, or an attachment when parent_file_id is supplied."
    required: true
  additional_files:
    description: "Additional attachment paths, one exact path per line. Spaces are supported; glob patterns are not expanded."
    required: false
  receipt:
    description: "Path to a saved upload receipt to resume. Files and metadata must match; uncertain uploads require dashboard reconciliation first."
    required: false
  changelog:
    description: "The changelog text to put on the file."
    required: false
  changelog_type:
    description: 'The type of the changelog. Allowed values: "text", "html" (aka. WYSIWYG), "markdown".'
    required: false
  display_name:
    description: "New main file's display name. Defaults to the filename; attachments always use their filenames."
    required: false
  parent_file_id:
    description: "Positive numeric ID of an existing parent. All selected files become attachments and inherit its game versions; omit game_versions."
    required: false
  game_versions:
    description: 'The game version IDs to select on this file. Separate IDs with "," (no quotes). See README for more info.'
    required: false
  release_type:
    description: 'The type of this release. Allowed values: "alpha", "beta", "release".'
    required: false
  manual_release:
    description: "auto preserves ordinary single-file publication and holds a new main file with attachments for dashboard release. true holds the file; false is rejected for a new main file with attachments."
    required: false
    default: "auto"
  relations:
    description: 'List of projects this file is related to and their relation type. Separate with "," (no quotes). Format: projectslug:relationType - Valid relationTypes are: embeddedLibrary, incompatible, optionalDependency, requiredDependency, and tool'
    required: false
outputs:
  id:
    description: "Accepted ID of file_path, emitted only when every selected file was accepted."
  receipt:
    description: "Upload receipt path for multi-file or receipt-based runs, including failed runs. Preserve it with an if: always() artifact step."
runs:
  using: "node24"
  main: "dist/index.js"
branding:
  icon: "arrow-up-circle"
  color: "orange"
